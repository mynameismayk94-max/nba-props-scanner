name: Diagnosticar desempenho da Auditoria e fallback NBA

on:
  push:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Medir consultas da Auditoria no staging
        run: |
          python - <<'PY'
          import json
          import time
          import requests

          base = "https://nba-props-scanner-staging.onrender.com"
          cases = [
              "/validation-history?market=assists&cohort=all&date_from=2026-11-18&date_to=2026-11-18",
              "/gap-validation?market=assists&score_band=all&cohort=all&date_from=2026-11-18&date_to=2026-11-18",
          ]

          session = requests.Session()
          for path in cases:
              started = time.perf_counter()
              response = session.get(base + path, timeout=90)
              elapsed = time.perf_counter() - started
              print(f"ENDPOINT {path.split('?')[0]}")
              print(f"HTTP {response.status_code}")
              print(f"ELAPSED_SECONDS {elapsed:.3f}")
              print(f"BYTES {len(response.content)}")
              response.raise_for_status()
              try:
                  payload = response.json()
                  print("STATUS", payload.get("status"))
              except Exception:
                  print("JSON_PARSE_FAILED")
              print("---")
          PY

      - name: Testar PDFs oficiais conhecidos
        run: |
          python -m pip install pypdf -q
          python - <<'PY'
          import requests
          from io import BytesIO
          from pypdf import PdfReader

          urls = [
              "https://ak-static.cms.nba.com/referee/injury/Injury-Report_2026-11-18_06_45PM.pdf",
              "https://ak-static.cms.nba.com/referee/injury/Injury-Report_2026-11-18_07_15PM.pdf",
              "https://ak-static.cms.nba.com/referee/injury/Injury-Report_2026-11-17_10_30PM.pdf",
          ]

          for url in urls:
              try:
                  response = requests.get(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 NBA Props Analytics",
                          "Accept": "application/pdf",
                      },
                      timeout=15,
                  )
                  print("URL", url)
                  print("HTTP", response.status_code)
                  print("CONTENT_TYPE", response.headers.get("content-type"))
                  print("BYTES", len(response.content))
                  print("PDF_HEADER", response.content[:5] == b"%PDF")
                  if response.content.startswith(b"%PDF"):
                      text = "\n".join(page.extract_text() or "" for page in PdfReader(BytesIO(response.content)).pages)
                      compact = " ".join(text.split())
                      for name in ["Scottie Barnes", "RJ Barrett", "Austin Reaves", "Grayson Allen"]:
                          if name.lower() in compact.lower():
                              print("FOUND", name)
                  print("---")
              except Exception as exc:
                  print("ERROR", repr(exc))
                  print("---")
          PY

      - name: Diagnosticar quatro pendências
        run: |
          python - <<'PY'
          import requests
          from app.nba_injury_reports import get_official_nba_injury_status, _normalize_matchup

          base = "https://nba-props-scanner-staging.onrender.com"
          cases = [
              ("2026-11-17", "Grayson Allen", "CHA", "LAL", "401910005"),
              ("2026-11-18", "Scottie Barnes", "TOR", "WSH", "401910012"),
              ("2026-11-18", "RJ Barrett", "TOR", "WSH", "401910012"),
              ("2026-11-18", "Austin Reaves", "LAL", "UTAH", "401910017"),
          ]

          for day, player, team, opponent, game_id in cases:
              print(f"CASE {day} | {player} | {game_id}")
              response = requests.get(f"{base}/games", params={"date": day}, timeout=90)
              print("GAMES_HTTP", response.status_code)
              response.raise_for_status()
              games = response.json().get("games", [])
              game = next((g for g in games if
                  {str((g.get("home") or {}).get("abbr", "")).upper(),
                   str((g.get("away") or {}).get("abbr", "")).upper()}
                  == {team, opponent}), None)
              if not game:
                  print("GAME_CONTEXT_NOT_FOUND")
                  print("---")
                  continue

              away = (game.get("away") or {}).get("abbr", "").upper()
              home = (game.get("home") or {}).get("abbr", "").upper()
              matchup = f"{away}@{home}"
              start = game.get("start_time_brt")
              print("GAME_CONTEXT", {
                  "game_id": game.get("game_id"),
                  "matchup": matchup,
                  "normalized": _normalize_matchup(matchup),
                  "start_time_brt": start,
                  "completed": game.get("completed"),
              })
              result = get_official_nba_injury_status(day, start, matchup, player)
              print("OFFICIAL_RESULT", result)
              print("---")
          PY
