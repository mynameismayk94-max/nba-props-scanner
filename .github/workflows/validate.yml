name: Validate NBA Props Scanner

on:
  push:
    branches:
      - feature/central-contexto-nba
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app

      - name: Run Context Center unit tests
        run: python -m unittest discover -s tests -v

      - name: Import API and verify Context routes
        run: |
          python - <<'PY'
          from app.main import app

          paths = set(app.openapi().get("paths", {}))
          required = {
              "/context/defense/refresh",
              "/context/defense/rankings",
              "/context/defense/team/{team}",
          }
          missing = required - paths
          assert not missing, f"Missing Context routes: {sorted(missing)}"
          print("API import and Context routes OK")
          PY

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, flags=re.IGNORECASE)
          Path("/tmp/index-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          assert scripts, "No inline JavaScript blocks found"
          PY
          node --check /tmp/index-inline.js
