name: Test audit collection 2026-11-19

on:
  push:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for staging deploy
        run: sleep 90

      - name: Collect 2026-11-19 by market
        run: |
          set -u
          API_BASE="https://nba-props-scanner-staging.onrender.com"
          FAILED=0

          for MARKET in points assists rebounds threes two_pa fgm; do
            echo "::group::2026-11-19 / $MARKET"
            BODY_FILE="/tmp/response-$MARKET.txt"
            HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
              --retry 2 --retry-delay 5 --retry-all-errors --max-time 180 \
              "$API_BASE/collect-results?date=2026-11-19&market=$MARKET" || true)
            echo "HTTP $HTTP_CODE"
            cat "$BODY_FILE" || true
            echo
            if [ "$HTTP_CODE" != "200" ]; then
              FAILED=1
            fi
            echo "::endgroup::"
          done

          exit "$FAILED"