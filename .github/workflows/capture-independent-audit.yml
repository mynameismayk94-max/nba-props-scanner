name: Capture independent audit snapshots

on:
  push:
    paths:
      - ".github/workflows/capture-independent-audit.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "API base URL (staging by default for manual tests)"
        required: false
        default: "https://nba-props-scanner-staging.onrender.com"
        type: string
      target_date:
        description: "Game date in YYYY-MM-DD (leave empty for today in Sao Paulo)"
        required: false
        type: string
  schedule:
    - cron: "0 9 * * *"
      timezone: "America/Sao_Paulo"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture all six markets in staging
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            API_BASE="https://nba-props-scanner-staging.onrender.com"
          else
            API_BASE="${INPUT_API_BASE:-https://nba-props-scanner-staging.onrender.com}"
          fi
          API_BASE="${API_BASE%/}"
          TARGET_DATE="${INPUT_TARGET_DATE:-$(TZ=America/Sao_Paulo date +%F)}"

          echo "Capturing independent audit snapshots"
          echo "API: $API_BASE"
          echo "Date: $TARGET_DATE"

          for MARKET in points assists rebounds threes two_pa fgm; do
            echo "::group::${TARGET_DATE} / ${MARKET}"
            curl --fail --show-error --silent \
              --max-time 900 \
              "${API_BASE}/capture-audit-snapshot?date=${TARGET_DATE}&market=${MARKET}"
            echo
            echo "::endgroup::"
          done

          echo "::group::Collect pending audit results"
          START_DATE="2026-11-16"
          END_DATE="$TARGET_DATE"
          CURRENT_DATE="$START_DATE"
          COLLECTION_FAILURES=0

          collect_market() {
            local RUN_DATE="$1"
            local MARKET="$2"

            echo "::group::${RUN_DATE} / ${MARKET}"
            if curl --fail --show-error --silent \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 180 \
              "${API_BASE}/collect-results?date=${RUN_DATE}&market=${MARKET}"
            then
              echo
              echo "Coleta concluída: ${RUN_DATE} / ${MARKET}"
            else
              echo
              echo "::warning::Falha na coleta: ${RUN_DATE} / ${MARKET}. Os demais mercados continuarão."
              COLLECTION_FAILURES=$((COLLECTION_FAILURES + 1))
            fi
            echo "::endgroup::"
          }

          while [ "$CURRENT_DATE" != "$END_DATE" ]; do
            for MARKET in points assists rebounds threes two_pa fgm; do
              collect_market "$CURRENT_DATE" "$MARKET"
            done
            CURRENT_DATE="$(date -d "$CURRENT_DATE + 1 day" +%F)"
          done

          for MARKET in points assists rebounds threes two_pa fgm; do
            collect_market "$END_DATE" "$MARKET"
          done

          if [ "$COLLECTION_FAILURES" -gt 0 ]; then
            echo "::error::${COLLECTION_FAILURES} combinação(ões) de data/mercado falharam. As demais foram processadas."
            exit 1
          fi

          echo "Todas as combinações de data/mercado foram processadas com sucesso."
          echo "::endgroup::"
            done
            CURRENT_DATE="$(date -d "$CURRENT_DATE + 1 day" +%F)"
          done

          for MARKET in points assists rebounds threes two_pa fgm; do
            echo "::group::${END_DATE} / ${MARKET}"
            curl --fail --show-error --silent \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 180 \
              "${API_BASE}/collect-results?date=${END_DATE}&market=${MARKET}"
            echo
            echo "::endgroup::"
          done
          echo "::endgroup::"
