name: Auditoria independente — captura e apuração

on:
  push:
    paths:
      - ".github/workflows/capture-independent-audit.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "API base URL (staging by default for manual tests)"
        required: false
        default: "https://nba-props-scanner-staging.onrender.com"
        type: string
      target_date:
        description: "Game date in YYYY-MM-DD (leave empty for today in Sao Paulo)"
        required: false
        type: string
  schedule:
    # Execução principal: 09:07 (horário de São Paulo).
    # Segunda janela no mesmo dia para reduzir o risco de atraso do scheduler.
    - cron: "7 9 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "37 9 * * *"
      timezone: "America/Sao_Paulo"

concurrency:
  group: independent-audit-staging
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Capture and reconcile independent audit in staging
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
          STAGING_ADMIN_API_KEY: ${{ secrets.STAGING_ADMIN_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${STAGING_ADMIN_API_KEY:-}" ]; then
            echo "::error::Secret STAGING_ADMIN_API_KEY não configurado."
            exit 1
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            API_BASE="https://nba-props-scanner-staging.onrender.com"
          else
            API_BASE="${INPUT_API_BASE:-https://nba-props-scanner-staging.onrender.com}"
          fi
          API_BASE="${API_BASE%/}"
          TARGET_DATE="${INPUT_TARGET_DATE:-$(TZ=America/Sao_Paulo date +%F)}"

          echo "Auditoria independente — captura + apuração"
          echo "API: $API_BASE"
          echo "Date: $TARGET_DATE"

          echo "::group::Rotina diária híbrida"
          RESPONSE="$(curl --fail --show-error --silent             --retry 3             --retry-delay 5             --retry-all-errors             --max-time 1800             --header "X-Admin-Key: ${STAGING_ADMIN_API_KEY}"             "${API_BASE}/refresh-audit?date=${TARGET_DATE}")"
          echo "$RESPONSE"
          echo "::endgroup::"

          echo "::group::Recovery — dia anterior"
          echo "Executando segunda tentativa da mesma rotina para capturar resultados tardios."
          RECOVERY_RESPONSE="$(curl --fail --show-error --silent             --retry 5             --retry-delay 15             --retry-all-errors             --max-time 1800             --header "X-Admin-Key: ${STAGING_ADMIN_API_KEY}"             "${API_BASE}/refresh-audit?date=${TARGET_DATE}")"
          echo "$RECOVERY_RESPONSE"
          echo "::endgroup::"

          echo "Auditoria independente concluída."
