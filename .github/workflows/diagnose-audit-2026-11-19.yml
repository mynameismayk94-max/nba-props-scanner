name: Diagnóstico somente leitura da auditoria 2026-11-19

on:
  push:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar pendências e diagnóstico por mercado no staging
        run: |
          set -euo pipefail
          API_BASE="https://nba-props-scanner-staging.onrender.com"

          for MARKET in points assists rebounds threes two_pa fgm; do
            echo "::group::Pendências 2026-11-19 / $MARKET"
            curl --fail --show-error --silent --max-time 60 \
              "$API_BASE/audit-pending-details?date=2026-11-19&market=$MARKET"
            echo
            echo "::endgroup::"
          done

          echo "::group::Diagnóstico consolidado 2026-11-19"
          curl --fail --show-error --silent --max-time 120 \
            "$API_BASE/audit-collection-diagnostics?date=2026-11-19"
          echo
          echo "::endgroup::"
