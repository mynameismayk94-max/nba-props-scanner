name: Inspeciona entries do roster ESPN

on:
  push:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar registros e referências do roster
        run: |
          set -euo pipefail
          URL="https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events/401910019/competitions/401910019/competitors/9/roster"
          ROSTER="$(curl --fail --show-error --silent --max-time 60 "$URL")"
          echo "::group::Primeiras entradas do roster"
          echo "$ROSTER" | jq '{draymond: [.entries[]? | select((.playerId|tostring) == "6589")], all: [.entries[]? | {playerId, displayName, active, didNotPlay, reason}]}'
          echo "::endgroup::"
          ATHLETE_REF="$(echo "$ROSTER" | jq -r '.entries[]? | select((.playerId|tostring) == "6589") | .athlete["$ref"] // empty')"
          if [ -n "$ATHLETE_REF" ]; then
            echo "::group::Atleta Draymond resolvido"
            curl --fail --show-error --silent --max-time 60 "$ATHLETE_REF" | jq '{id, displayName, fullName, firstName, lastName}'
            echo "::endgroup::"
          fi
